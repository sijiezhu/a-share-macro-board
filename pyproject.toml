[project]
name = "a-share-macro-board"
version = "1.0.0"
requires-python = ">=3.11,<3.15"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", ".venv", ".streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501", # 文档字符串、CSS 片段与提示文本允许较长
  "S101", # 单元测试使用 assert/self.assert 是有意为之
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data"]
skips = ["B101"]
